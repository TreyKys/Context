name: Build test APK

# Builds a sideloadable release APK and attaches it to the run as a downloadable
# artifact — so you can grab a build straight from the Actions tab instead of
# pushing binaries to a throwaway branch.
#
# No secrets are needed: android/key.properties is git-ignored and absent in CI,
# and build.gradle.kts falls back to debug signing when it's missing. That's fine
# for sideload testing, but such an APK can NOT be uploaded to Play — build the
# signed AAB locally for that.

# NOTE: the "Run workflow" button only appears once this file is on the repo's
# DEFAULT branch — that's a GitHub requirement for workflow_dispatch. Until this
# is merged to main, use the push trigger below: any push to the branch builds
# an APK automatically, which works from a feature branch.
on:
  push:
    branches:
      - claude/production-readiness-firebase-ai
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - ".github/workflows/build-test-apk.yml"
  workflow_dispatch:
    inputs:
      enable_app_check:
        description: "Activate Firebase App Check (required when Basic - Enforced is on in Firebase Console)"
        type: boolean
        default: true
      use_debug_provider:
        description: "Use App Check Debug Provider (required for sideloaded APKs, which cannot pass Play Integrity)"
        type: boolean
        default: true
      app_check_debug_token:
        description: "Optional pre-registered App Check debug token UUID (if empty, copy the device's token from Settings)"
        type: string
        default: ""
      show_debug_errors:
        description: "Render the raw exception text and App Check debug token on the result card"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Non-blocking: surfaces analyser problems without failing the diagnostic
      # build, since the point of this workflow is to get an APK in hand.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # On a push build `inputs.*` are empty, so these comparisons fall through
      # to the diagnostic defaults: App Check on with Debug Provider, raw errors on.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=ENABLE_APP_CHECK=${{ inputs.enable_app_check != false }} \
            --dart-define=USE_APP_CHECK_DEBUG_PROVIDER=${{ inputs.use_debug_provider != false }} \
            --dart-define=APP_CHECK_DEBUG_TOKEN=${{ inputs.app_check_debug_token }} \
            --dart-define=SHOW_DEBUG_ERRORS=${{ inputs.show_debug_errors != false }}

      - uses: actions/upload-artifact@v4
        with:
          name: context-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
