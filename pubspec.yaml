name: context_dictionary
description: "The Context Dictionary — AI-powered cultural and contextual word definitions."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  # Firebase AI Logic (formerly "Vertex AI in Firebase"). Replaces the direct
  # google_generative_ai SDK so no Gemini API key ships in the app.
  firebase_ai: ^3.12.1
  flutter_riverpod: ^3.2.1
  animated_text_kit: ^4.3.0
  google_fonts: ^8.0.2
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  flutter_timezone: ^5.0.2
  shared_preferences: ^2.5.4
  google_mobile_ads: ^7.0.0
  sqflite: ^2.4.2
  path: ^1.9.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  in_app_purchase: ^3.2.0
  http: ^1.2.2
  flutter_overlay_window: ^0.4.4
  flutter_secure_storage: ^10.3.0
  purchases_flutter: ^10.1.1
  firebase_core: ^4.9.0
  firebase_app_check: ^0.4.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true